name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Tag $RELEASE_TAG does not match VERSION $VERSION" >&2
            exit 1
          }
          grep -F "## [$VERSION]" CHANGELOG.md
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zip unzip
      - run: shellcheck ./*.sh ./lib/*.sh ./tests/*.sh
      - run: ./tests/run.sh
      - name: Build source archive
        run: git archive --format=tar.gz --prefix="mtls-cli-${GITHUB_REF_NAME#v}/" -o "mtls-cli-${GITHUB_REF_NAME#v}.tar.gz" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tar.gz --generate-notes --verify-tag
