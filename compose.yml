services:
  step-ca:
    image: smallstep/step-ca:0.30.2
    container_name: step-ca
    init: true
    restart: unless-stopped
    ports:
      - "${STEP_CA_BIND_ADDRESS:-127.0.0.1}:${STEP_CA_PORT:-9001}:9000"
    volumes:
      - ./step:/home/step
    environment:
      DOCKER_STEPCA_INIT_NAME: "${STEP_CA_NAME:-Homelab CA}"
      DOCKER_STEPCA_INIT_DNS_NAMES: "${STEP_CA_DNS_NAMES:-localhost}"
      DOCKER_STEPCA_INIT_PASSWORD: "${STEP_CA_PASSWORD:?Copy .env.example to .env and set STEP_CA_PASSWORD}"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
